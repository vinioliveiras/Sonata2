<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Sonata Launchpad icon, Light appearance: original design (app grid on a tile), sized to
       the Sonata-MacTahoe grid (tile inset 4 px, soft shadow). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e3e8"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="13" fill="url(#bg)" filter="url(#sh)"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="12.5" fill="none" stroke="#000" stroke-opacity=".08"/>
  <g>
    <rect x="15" y="15" width="9" height="9" rx="2.6" fill="#ff5f57"/>
    <rect x="27.5" y="15" width="9" height="9" rx="2.6" fill="#febc2e"/>
    <rect x="40" y="15" width="9" height="9" rx="2.6" fill="#28c840"/>
    <rect x="15" y="27.5" width="9" height="9" rx="2.6" fill="#0a84ff"/>
    <rect x="27.5" y="27.5" width="9" height="9" rx="2.6" fill="#bf5af2"/>
    <rect x="40" y="27.5" width="9" height="9" rx="2.6" fill="#ff9f0a"/>
    <rect x="15" y="40" width="9" height="9" rx="2.6" fill="#64d2ff"/>
    <rect x="27.5" y="40" width="9" height="9" rx="2.6" fill="#ff375f"/>
    <rect x="40" y="40" width="9" height="9" rx="2.6" fill="#8e8e93"/>
  </g>
</svg>
