# Sonata 2 in Rust (docs/RUST_PORT.md). The Python package stays the
# working Sonata until each component here replaces its Python version.
[workspace]
resolver = "2"
members = [
    "crates/sonata-config",
    "crates/sonata-i18n",
    "crates/sonata-ui",
    "apps/calculator",
    "apps/clock",
    "apps/sonata2-rs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"

[workspace.dependencies]
# GTK 4.12 / libadwaita 1.4: Sonata's minimum (docs/GUIDE.md)
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }
gio = "0.20"
glib = "0.20"
serde_json = { version = "1", features = ["preserve_order"] }   # keys keep their order, as Python writes them
libc = "0.2"
num-bigint = "0.4"
num-traits = "0.2"
regex = "1"
tempfile = "3"

sonata-config = { path = "crates/sonata-config" }
sonata-i18n = { path = "crates/sonata-i18n" }
sonata-ui = { path = "crates/sonata-ui" }
sonata-calculator = { path = "apps/calculator" }
sonata-clock = { path = "apps/clock" }

[profile.release]
lto = "thin"
strip = true
