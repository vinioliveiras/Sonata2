[package]
name = "sonata-clock"
description = "Clock (macOS Ventura Clock): Alarms, Stopwatch, Timers -- ported from sonata2/clock/"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["gui"]
# the window; without it only the alarms and timers logic builds
gui = ["dep:gtk", "dep:adw", "dep:sonata-ui"]

[dependencies]
serde_json.workspace = true
libc.workspace = true
sonata-config.workspace = true
sonata-i18n.workspace = true
gtk = { workspace = true, optional = true }
adw = { workspace = true, optional = true }
sonata-ui = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
