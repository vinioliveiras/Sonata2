[package]
name = "sonata2-rs"
description = "Sonata 2 in Rust: one binary, `sonata2-rs <component>` (as `sonata2 <component>`)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sonata2-rs"
path = "src/main.rs"

[dependencies]
sonata-calculator.workspace = true
sonata-clock.workspace = true
sonata-textedit.workspace = true
sonata-preview.workspace = true
sonata-notes.workspace = true
sonata-welcome.workspace = true
sonata-lock.workspace = true
sonata-spotlight.workspace = true
sonata-polkit.workspace = true
sonata-feedback.workspace = true
sonata-diskutil.workspace = true
sonata-config.workspace = true
sonata-session.workspace = true
sonata-i18n.workspace = true

[dev-dependencies]
tempfile.workspace = true
