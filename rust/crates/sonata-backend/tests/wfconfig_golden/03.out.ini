[core]
plugins = alpha autostart command decoration grid resize scale sonata-resize
vwidth = 1
vheight = 1
xwayland_startup_script = my-own-x11-script --flag

[command]
binding_switcher_alt = <alt> KEY_TAB
command_switcher_alt = gdbus call switcher next
# binding_old = <super> KEY_TAB
command = x

[scale]
toggle = <super> KEY_TAB | <ctrl> KEY_UP | KEY_F3 | swipe up 3
outer_margin = 28

[pixdecor]
right_button_x_offset = 9
button_layout = close,minimize,maximize:
rounded_corner_radius = 10
left_button_spacing = 8
left_button_x_offset = 7
title_font = Inter Variable Semi-Bold 10
title_text_align = 1
shadow_radius = 3
shadow_color = \#0000001f

[sonata-corners]
radius = 10

[decoration]
button_order = minimize maximize close
title_height = 28
title_halign = center
font = Inter Semi-Bold

[grid]
type = none
