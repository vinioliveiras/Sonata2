# Sonata 2 -- Wayfire settings the shell relies on.
# Until the session installer exists (ROADMAP M3), merge these sections into
# ~/.config/wayfire.ini by hand. Tested with Wayfire 0.11 option names.

[core]
# Keep your own list; Sonata needs at least these plugins:
#   animate blur foreign-toplevel wayfire-shell gtk-shell
plugins = alpha animate autostart blur command decoration expo fast-switcher foreign-toplevel grid gtk-shell idle move place resize session-lock shortcuts-inhibit switcher vswitch wayfire-shell window-rules wm-actions

[blur]
# Frosted glass (Big Sur vibrancy) behind every Sonata surface. Layer-shell
# surfaces report their namespace as app_id ("sonata2-dock", ...).
blur_by_default = app_id contains "sonata2-"
method = kawase
kawase_offset = 5
kawase_iterations = 3
kawase_degrade = 1
saturation = 1.6
# Blur fully where the plate is (alpha >= 0.3) and barely under its soft
# shadow, so no blurred halo shows around the rounded corners.
alpha_threshold = 0.3
alpha_exponent = 2.0

[animate]
open_animation = zoom
close_animation = zoom
duration = 250ms
# Windows minimize into their Dock icon (the Dock sends the icon rectangle).
minimize_animation = squeezimize
squeezimize_duration = 350ms

[command]
# Launchpad: F4 like on a Mac keyboard (run again to close).
binding_launchpad = KEY_F4
command_launchpad = env PYTHONPATH=$HOME/GitHub/sonata2 python3 -m sonata2 launchpad

[autostart]
# Until install.sh exists, run it from the repo clone:
sonata2_dock = env PYTHONPATH=$HOME/GitHub/sonata2 python3 -m sonata2 dock
sonata2_launchpad = env PYTHONPATH=$HOME/GitHub/sonata2 python3 -m sonata2 launchpad --background
