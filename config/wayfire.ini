# Sonata 2 -- Wayfire configuration of the Sonata session.
# install.sh copies it to ~/.config/sonata2/wayfire.ini (kept if you edited
# it); your own ~/.config/wayfire.ini is never touched. Commands use the
# `sonata2` launcher from install.sh. Wayfire 0.11 option names.

[core]
# Apps draw their own title bars when they can (GTK: Big Sur theme).
preferred_decoration_mode = client
# Keep your own list; Sonata needs at least these plugins:
#   animate blur foreign-toplevel wayfire-shell gtk-shell
# Close window: Super+Q (macOS Cmd+Q) or Alt+F4
close_top_view = <super> KEY_Q | <alt> KEY_F4
plugins = alpha animate autostart blur command decoration expo fast-switcher foreign-toplevel grid gtk-shell idle move place resize scale session-lock shortcuts-inhibit switcher vswipe vswitch wayfire-shell window-rules wm-actions
# Spaces side by side, like macOS
vwidth = 4
vheight = 1

[input]
# Sonata cursors (bundled macOS cursors; found via XCURSOR_PATH from
# tools/session-env.sh).
cursor_theme = Sonata-Cursors
cursor_size = 24

[decoration]
# Title bars Wayfire draws itself (apps that don't draw their own: most
# X11/XWayland apps). GTK apps draw theirs with the Sonata GTK theme.
# Big Sur light title bar; Wayfire colours its round buttons red/yellow/
# green on hover. Limitation: Wayfire puts them on the right (see DEVLOG).
active_color = \#e8e8e8ff
inactive_color = \#f6f6f6ff
font = Inter Semi-Bold
font_color = \#262626ff
font_scale = 0.46
title_height = 28
title_halign = center
title_valign = center
border_size = 1
button_order = minimize maximize close
button_scale = 0.46
button_padding = 6

[pixdecor]
# Used instead of [decoration] when the pixdecor plugin is installed (AUR:
# wayfire-plugin-pixdecor-git; tools/wayfire-config.sh swaps it in): macOS
# title bars for windows that don't draw their own -- traffic lights on the
# left (tools/gen-decor.py), centred title, 10 px corners, soft shadow.
# @SONATA@ becomes the Sonata folder when the session starts.
button_layout = close,minimize,maximize:
button_close_image = @SONATA@/sonata2/data/decor/close.png
button_minimize_image = @SONATA@/sonata2/data/decor/minimize.png
button_maximize_image = @SONATA@/sonata2/data/decor/maximize.png
button_restore_image = @SONATA@/sonata2/data/decor/restore.png
button_close_hover_image = @SONATA@/sonata2/data/decor/close-hover.png
button_minimize_hover_image = @SONATA@/sonata2/data/decor/minimize-hover.png
button_maximize_hover_image = @SONATA@/sonata2/data/decor/maximize-hover.png
button_restore_hover_image = @SONATA@/sonata2/data/decor/restore-hover.png
# first dot centred 20 px from the edge, dots 8 px apart: like Sonata's windows
left_button_spacing = 8
left_button_x_offset = 14
title_font = Inter Variable Semi-Bold 10
title_text_align = 1
fg_color = \#e8e8e8ff
bg_color = \#f6f6f6ff
fg_text_color = \#262626ff
bg_text_color = \#9a9a9aff
border_size = 1
titlebar = always
# maximized windows keep the rounded corners (Vini)
maximized_borders = true
maximized_shadows = false
overlay_engine = rounded_corners
rounded_corner_radius = 10
shadow_radius = 24
shadow_color = \#00000055
enable_shade = false

[blur]
# Frosted glass (Big Sur vibrancy) behind every Sonata surface. Layer-shell
# surfaces report their namespace as app_id ("sonata2-dock", ...); Sonata
# apps have app_ids like io.github.vinioliveiras.sonata2.files (only their
# translucent parts -- sidebars -- show the blur).
blur_by_default = app_id contains "sonata2"
method = kawase
kawase_offset = 5
kawase_iterations = 3
kawase_degrade = 1
saturation = 1.6
# Blur fully where the plate is (alpha >= 0.3) and barely under its soft
# shadow, so no blurred halo shows around the rounded corners.
alpha_threshold = 0.3
alpha_exponent = 2.0

[animate]
open_animation = zoom
close_animation = zoom
duration = 250ms
# Windows minimize into their Dock icon (the Dock sends the icon rectangle).
minimize_animation = squeezimize
squeezimize_duration = 350ms

[command]
# Launchpad: F4 like on a Mac keyboard; Spotlight: Super+Space (macOS
# Cmd+Space). Running them again closes them.
binding_launchpad = KEY_F4
command_launchpad = sonata2 launchpad
binding_spotlight = <super> KEY_SPACE
command_spotlight = sonata2 spotlight
# App switcher (macOS Cmd+Tab): Super+Tab / Super+Shift+Tab; the menu bar
# process shows it (gdbus: instant). Alt+Tab keeps Wayfire's fast switcher.
binding_switcher = <super> KEY_TAB
command_switcher = gdbus call --session --dest io.github.vinioliveiras.sonata2.topbar --object-path /io/github/vinioliveiras/sonata2/topbar --method org.freedesktop.Application.ActivateAction switcher "[<'next'>]" "{}"
binding_emoji = <ctrl> <super> KEY_SPACE
command_emoji = gdbus call --session --dest io.github.vinioliveiras.sonata2.topbar --object-path /io/github/vinioliveiras/sonata2/topbar --method org.freedesktop.Application.ActivateAction emoji "[]" "{}"
binding_switcher_back = <super> <shift> KEY_TAB
command_switcher_back = gdbus call --session --dest io.github.vinioliveiras.sonata2.topbar --object-path /io/github/vinioliveiras/sonata2/topbar --method org.freedesktop.Application.ActivateAction switcher "[<'prev'>]" "{}"
# Lock Screen: Ctrl+Super+Q (macOS Ctrl+Cmd+Q)
binding_lock = <ctrl> <super> KEY_Q
command_lock = sonata2 lock
binding_settings = <super> KEY_COMMA
command_settings = sonata2 settings
# Emergency terminal: Ctrl+Alt+T is handled by Wayfire itself, so it works
# even if every Sonata component has crashed ($TERMINAL first, then the
# usual terminals).
binding_terminal = <ctrl> <alt> KEY_T
command_terminal = sh -c 'for t in "$TERMINAL" kgx gnome-terminal konsole kitty alacritty foot ghostty wezterm xfce4-terminal xterm; do [ -n "$t" ] && command -v "$t" >/dev/null && exec "$t"; done'
# Media keys, with the Big Sur volume/brightness HUD (held keys repeat)
repeatable_binding_volume_up = KEY_VOLUMEUP
command_volume_up = sonata2 key volume-up
repeatable_binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = sonata2 key volume-down
binding_volume_mute = KEY_MUTE
command_volume_mute = sonata2 key volume-mute
repeatable_binding_brightness_up = KEY_BRIGHTNESSUP
command_brightness_up = sonata2 key brightness-up
repeatable_binding_brightness_down = KEY_BRIGHTNESSDOWN
command_brightness_down = sonata2 key brightness-down
# Screenshots like macOS (saved to the Desktop): Super+Shift+3 whole
# screen, Super+Shift+4 a selection; Print Screen too.
binding_screenshot = <super> <shift> KEY_3 | KEY_SYSRQ
command_screenshot = sonata2 screenshot
binding_screenshot_area = <super> <shift> KEY_4
command_screenshot_area = sonata2 screenshot area
binding_capture = <super> <shift> KEY_5
command_capture = sonata2 screenshot toolbar
# Launchpad: pinch with the thumb and three fingers
binding_launchpad_pinch = pinch in 4
command_launchpad_pinch = sonata2 launchpad

[wm-actions]
minimize = <super> KEY_M
toggle_maximize = <ctrl> <super> KEY_F

[fast-switcher]
# Window cycling without a HUD: Alt+Tab (the macOS-style switcher is Super+Tab)
activate = <alt> KEY_TAB

[scale]
# Mission Control: Ctrl+Up, F3, or swipe up with three fingers
toggle = <ctrl> KEY_UP | KEY_F3 | swipe up 3
# App Exposé (every window, all Spaces): Ctrl+Down, swipe down with three fingers
toggle_all = <ctrl> KEY_DOWN | swipe down 3
include_minimized = true
spacing = 40

[vswipe]
# Swipe between Spaces with three fingers (macOS default)
fingers = 3
enable_vertical = false
enable_smooth_transition = true

[expo]
# All Spaces at once: Ctrl+Super+Up
toggle = <ctrl> <super> KEY_UP

[idle]
# Turn the display off after 10 minutes (Settings > Battery changes it)
dpms_timeout = 600
screensaver_timeout = -1

[autostart]
autostart_wf_shell = false
# Hand the session environment (Wayland display, themes, Sonata dconf layer)
# to D-Bus/systemd-activated services such as portals.
0_env = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_DATA_DIRS DCONF_PROFILE GTK_THEME XCURSOR_THEME XCURSOR_SIZE XCURSOR_PATH QT_QPA_PLATFORMTHEME
sonata2_wallpaper = sonata2 wallpaper
sonata2_dock = sonata2 dock
sonata2_topbar = sonata2 topbar
sonata2_launchpad = sonata2 launchpad --background
sonata2_spotlight = sonata2 spotlight --background
# Apps set to "Open at Login" (~/.config/autostart)
sonata2_autostart = sonata2 autostart
