<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfc"/><stop offset="1" stop-color="#d6d6db"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a50"/><stop offset="1" stop-color="#1f1f23"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a9aa1"/><stop offset="1" stop-color="#6e6e75"/>
    </linearGradient>
    <linearGradient id="op" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffbf4d"/><stop offset="1" stop-color="#ff9500"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/><feOffset dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope=".25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#bg)"/>
  <g filter="url(#sh)">
    <rect x="58" y="48" width="140" height="44" rx="12" fill="url(#screen)"/>
    <rect x="64" y="52" width="128" height="14" rx="7" fill="#fff" opacity=".08"/>
  </g>
  <g filter="url(#sh)">
    <circle cx="78" cy="122" r="15" fill="url(#key)"/><circle cx="128" cy="122" r="15" fill="url(#key)"/>
    <circle cx="178" cy="122" r="15" fill="url(#op)"/>
    <circle cx="78" cy="164" r="15" fill="url(#key)"/><circle cx="128" cy="164" r="15" fill="url(#key)"/>
    <circle cx="178" cy="164" r="15" fill="url(#op)"/>
    <circle cx="78" cy="206" r="15" fill="url(#key)"/><circle cx="128" cy="206" r="15" fill="url(#key)"/>
    <circle cx="178" cy="206" r="15" fill="url(#op)"/>
  </g>
  <rect x="12.5" y="12.5" width="231" height="231" rx="53.5" fill="none" stroke="#000" stroke-opacity=".06"/>
</svg>
