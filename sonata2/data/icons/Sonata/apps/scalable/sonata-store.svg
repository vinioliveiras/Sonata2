<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1fc8ff"/><stop offset="1" stop-color="#1a63f0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/><stop offset="1" stop-color="#ffffff" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset="1" stop-color="#ffffff" stop-opacity=".35"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#bg)"/>
  <rect x="12.5" y="12.5" width="231" height="231" rx="53.5" fill="none" stroke="#fff" stroke-opacity=".3"/>
  <g filter="url(#sh)" transform="translate(128 140) scale(.82) translate(-128 -140)">
    <!-- the handle: a glass tube -->
    <path d="M100 98 v-12 a28 28 0 0 1 56 0 v12" fill="none" stroke="url(#edge)" stroke-width="12" stroke-linecap="round"/>
    <path d="M100 98 v-12 a28 28 0 0 1 56 0 v12" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="3"
          stroke-linecap="round" transform="translate(-2 -1)"/>
    <!-- the bag: frosted glass, a brighter rim -->
    <path d="M70 98 q0-10 10-10 h96 q10 0 10 10 l6 98 q1 14-13 14 H77 q-14 0-13-14z" fill="url(#glass)"/>
    <path d="M70 98 q0-10 10-10 h96 q10 0 10 10 l6 98 q1 14-13 14 H77 q-14 0-13-14z" fill="none"
          stroke="url(#edge)" stroke-width="3"/>
    <!-- light catching the top of the glass -->
    <path d="M80 94 h96" stroke="#fff" stroke-opacity=".9" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
